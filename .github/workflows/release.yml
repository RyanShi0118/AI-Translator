name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MANIFEST=$(node -p "require('./dist/manifest.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "manifest.json version ($MANIFEST) does not match tag ($TAG)"; exit 1
          fi

      - name: Package extension
        run: |
          NAME="refine-translate-${GITHUB_REF_NAME}"
          (cd dist && zip -r "../${NAME}.zip" .)
          echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ## Install
            1. Download `${{ env.ASSET }}` below and unzip it.
            2. Open `chrome://extensions` (or `edge://extensions`) and enable **Developer mode**.
            3. Click **Load unpacked** and select the unzipped folder.
            4. Open the extension settings, pick a provider, paste your API key and click **Test Connection**.

            ## Usage
            - Select text, then click the floating icon or press <kbd>Alt</kbd>+<kbd>T</kbd>.
            - In an input or editor, press <kbd>Ctrl/⌘</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> or tap <kbd>Space</kbd> three times.
