<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- incoming beam: the raw text -->
  <path d="M10 76 L50 62" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- outgoing spectrum: the translation -->
  <g stroke-width="8" stroke-linecap="round">
    <path d="M76 58 L118 40" stroke="#fbbf24"/>
    <path d="M78 66 L118 62" stroke="#34d399"/>
    <path d="M78 74 L118 84" stroke="#38bdf8"/>
  </g>
  <!-- the prism: the refinement -->
  <path d="M64 22 L96 92 H32 Z" fill="url(#glass)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 38 L50 72" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
</svg>
